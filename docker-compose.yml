services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL}
      # Proxies between the internet and Django, for real client IPs in rate
      # limiting. Locally: nginx only = 1. Behind Azure ingress + nginx = 2.
      NUM_PROXIES: ${NUM_PROXIES:-1}

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
