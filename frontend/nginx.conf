# Use the proxy-supplied scheme when one exists (Azure's ingress terminates
# TLS and sets X-Forwarded-Proto: https); fall back to this hop's own scheme
# when hit directly (local compose, plain http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Everything under /api goes to gunicorn on the same origin (Decision 108),
    # so the browser never makes a cross-origin request. No URI part on
    # proxy_pass: the /api/ prefix is forwarded as is, matching Django's
    # path('api/', ...). "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback: unknown paths (e.g. /content-types/3 on a hard refresh)
    # serve index.html so react-router can handle them client-side.
    location / {
        try_files $uri /index.html;
    }
}
