<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Lattice</title>
  <style>
    .bg { fill: #171717 }
    .edge { stroke: #93A5C4 }
    .node { fill: #FAFAFA }
    .ghost-node { fill: #93A5C4 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FAFAFA }
      .edge { stroke: #6B7FA3 }
      .node { fill: #171717 }
      .ghost-node { fill: #6B7FA3 }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14" />
  <!-- the rest of the 3x3 lattice, faded so the L stays the hero -->
  <g class="edge" stroke-width="2" opacity="0.25" stroke-linecap="round" fill="none">
    <path d="M32 16H48M48 16V48M32 32H48" />
    <path d="M32 16V32" />
  </g>
  <g class="ghost-node" opacity="0.4">
    <circle cx="32" cy="16" r="3" />
    <circle cx="48" cy="16" r="3" />
    <circle cx="32" cy="32" r="3" />
    <circle cx="48" cy="32" r="3" />
  </g>
  <!-- the L: five nodes joined by edges -->
  <path class="edge" d="M16 16V48H48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <g class="node">
    <circle cx="16" cy="16" r="5.5" />
    <circle cx="16" cy="32" r="5.5" />
    <circle cx="16" cy="48" r="5.5" />
    <circle cx="32" cy="48" r="5.5" />
    <circle cx="48" cy="48" r="5.5" />
  </g>
</svg>
